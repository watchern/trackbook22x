apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'androidx.navigation.safeargs.kotlin'

android {
    compileSdkVersion 32

    defaultConfig {
        applicationId 'org.y20k.trackbook'
        minSdkVersion 25
        targetSdkVersion 32
        versionCode 50
        versionName '2.1.2'
        resConfigs "en", "da", "de", "fr", "hr", "id", "it", "ja", "nb-rNO", "nl", "pl", "pt-rBR", "ru", "sv", "tr", "zh-rCN"
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        disable 'MissingTranslation', 'GoogleAppIndexingWarning'
    }

    packagingOptions {
        exclude 'META-INF/*'
        // mapsforge-themes ships its render theme files as jar resources - we bundle them
        // as proper app assets instead (see src/main/assets), so exclude the jar copies
        exclude 'assets/mapsforge/**'
        exclude 'assets/patterns/**'
        exclude 'assets/symbols/**'
    }

    // enable view binding (used by MapsFragment)
    buildFeatures {
        viewBinding true
    }

    // do not compress offline map assets - mapsforge needs random access while streaming
    aaptOptions {
        noCompress 'map', 'mbtiles'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // sign release builds in CI (GitHub Actions); falls back to the debug key when not configured
            signingConfig signingConfigs.debug
        }
        debug {
            // Comment out the below lines if you do not need to test resource shrinking
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile(
//                    'proguard-android-optimize.txt'),
//                    'proguard-rules.pro'
        }
    }
}

// optional release signing - configured via environment variables in CI (see .github/workflows/)
def releaseKeystoreFile = System.getenv("TRACKBOOK_RELEASE_STORE_FILE")
if (releaseKeystoreFile != null && !releaseKeystoreFile.trim().isEmpty() && file(releaseKeystoreFile).exists()) {
    android.signingConfigs.create("ciRelease") {
        storeFile file(releaseKeystoreFile)
        storePassword System.getenv("TRACKBOOK_RELEASE_STORE_PASSWORD")
        keyAlias System.getenv("TRACKBOOK_RELEASE_KEY_ALIAS")
        keyPassword System.getenv("TRACKBOOK_RELEASE_KEY_PASSWORD")
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.ciRelease
}

dependencies {
    // Kotlin
    def coroutinesVersion = "1.5.2"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"

    // AndroidX
    def navigationVersion = "2.4.2"
    implementation "androidx.activity:activity-ktx:1.4.0"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.4.1'
    implementation "androidx.navigation:navigation-fragment-ktx:$navigationVersion"
    implementation "androidx.navigation:navigation-ui-ktx:$navigationVersion"
    implementation 'androidx.preference:preference-ktx:1.2.0'
    implementation 'com.google.android.material:material:1.6.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.9.0'

    // OpenStreetMap
    implementation 'org.osmdroid:osmdroid-android:6.1.11'

    // Offline vector maps (mapsforge format, v5) - renders jiangsu.map locally, no network
    def mapsforgeVersion = "0.20.0"
    implementation "org.mapsforge:mapsforge-map-android:$mapsforgeVersion"
    implementation "org.mapsforge:mapsforge-themes:$mapsforgeVersion"

    // Background download of the offline map
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
}
