name: Android CI Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download bundled offline map
        run: |
          URL="https://download.mapsforge.org/maps/v5/asia/china/jiangsu.map"
          curl -sSL --retry 3 --max-time 900 -o app/src/main/assets/mbtiles/jiangsu.map "$URL"
          SIZE=$(stat -c%s app/src/main/assets/mbtiles/jiangsu.map)
          echo "bundled map size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then echo "ERROR: map file too small - download broken"; exit 1; fi
          if ! head -c 20 app/src/main/assets/mbtiles/jiangsu.map | grep -q "mapsforge binary OSM"; then
            echo "ERROR: invalid mapsforge magic byte"; exit 1
          fi

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build-debug.log
          exit ${PIPESTATUS[0]}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-logs
          path: build-debug.log
          if-no-files-found: warn

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackbook-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
