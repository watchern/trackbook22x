name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Decode release keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "store_file=app/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Keystore decoded."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found - APK will be signed with the debug key."
            echo "store_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          TRACKBOOK_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          TRACKBOOK_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          TRACKBOOK_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TRACKBOOK_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build-release.log
          exit ${PIPESTATUS[0]}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-logs
          path: build-release.log
          if-no-files-found: warn

      - name: Push build log to ci-logs branch on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-log-bot"
          git config user.email "noreply@github.com"
          git fetch origin master
          git checkout --detach FETCH_HEAD
          git add build-release.log
          git commit -m "release build log (${GITHUB_SHA})"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-logs --force

      - name: Collect APKs
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/*.apk apks/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk apks/ 2>/dev/null || true
          ls -la apks

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trackbook-apks
          path: apks/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
